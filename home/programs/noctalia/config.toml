[shell]
avatar_path = "@xdgDataHome@/avatars/avatar.jpg"
ui_scale = 1.25
clipboard_enabled = false

[plugins]
# Enable the hotspot declaratively, but keep its Wi-Fi password out of Git.
enabled = ["cleboost/hotspot"]

[location]
auto_locate = false
# Change the address to "Hong Kong" when moving there.
address = "Shanghai"

[shell.screenshot]
copy_to_clipboard = true
save_to_file = false

[lockscreen]
# Let swaylock exclusively own ext-session-lock-v1 and logind lock handling.
enabled = false

[shell.session]
[[shell.session.actions]]
# Keep this visible while Noctalia's native lock screen is disabled.
action = "command"
label = "Lock & Suspend"
glyph = "bedtime"
command = "swaylock -f && systemctl suspend"
variant = "primary"
shortcut = "1"

[[shell.session.actions]]
action = "reboot"
variant = "destructive"
countdown_seconds = 5
shortcut = "2"

[[shell.session.actions]]
action = "shutdown"
variant = "destructive"
countdown_seconds = 5
shortcut = "3"

[bar.default]
auto_hide = true
reserve_space = false
start = ["workspaces"]
end = ["tray", "notifications", "ram", "battery", "session"]
scale = 1.25

[control_center]
width = 900

# Keep the default shortcuts, replacing Power Profile with the hotspot toggle.
[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "cleboost/hotspot:cc-toggle"

[osd.kinds]
# Fcitx5 already indicates the active input method; avoid a duplicate popup.
keyboard_layout = false

[system.monitor]
enabled = true  
# Keep GPU polling infrequent and avoid unnecessarily waking the discrete GPU.
gpu_poll_seconds = 5.0

# highlighting
cpu_usage_activity_threshold = 50     # %
cpu_usage_critical_threshold = 90     # %
cpu_temp_activity_threshold  = 60     # °C
cpu_temp_critical_threshold  = 85     # °C
cpu_freq_activity_threshold  = 2.5    # GHz
cpu_freq_critical_threshold  = 4.5    # GHz
gpu_temp_activity_threshold  = 60     # °C
gpu_temp_critical_threshold  = 85     # °C
gpu_usage_activity_threshold = 50     # %
gpu_usage_critical_threshold = 95     # %
gpu_vram_activity_threshold  = 50     # %
gpu_vram_critical_threshold  = 90     # %
ram_pct_activity_threshold   = 60     # %
ram_pct_critical_threshold   = 90     # %
swap_pct_activity_threshold  = 20     # %
swap_pct_critical_threshold  = 80     # %
disk_used_pct_activity_threshold = 80 # %
disk_used_pct_critical_threshold = 95 # %
disk_used_activity_threshold     = 80 # %
disk_used_critical_threshold     = 95 # %
disk_free_pct_activity_threshold = 80 # %
disk_free_pct_critical_threshold = 95 # %
disk_free_activity_threshold     = 80 # %
disk_free_critical_threshold     = 95 # %
net_rx_activity_threshold    = 1      # MB/s
net_rx_critical_threshold    = 50     # MB/s
net_tx_activity_threshold    = 1      # MB/s
net_tx_critical_threshold    = 50     # MB/s





# Keep a blurred wallpaper texture ready for Niri's overview backdrop.
# This stays resident in GPU memory so overview entry does not need to regenerate it.
[backdrop]
enabled = true
blur_intensity = 0.5
tint_intensity = 0.3

[wallpaper]
enabled = true
directory = "@xdgDataHome@/wallpapers"

[widget.ram]
type = "sysmon"
stat = "ram_pct"
visualization = "none"
show_value = true
show_glyph = true
