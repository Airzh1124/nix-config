[shell]
avatar_path = "@xdgDataHome@/avatars/avatar.jpg"
ui_scale = 1.25
clipboard_enabled = false

[location]
auto_locate = false
# Change the address to "Hong Kong" when moving there.
address = "Shanghai"

[shell.screenshot]
copy_to_clipboard = true
save_to_file = false

[lockscreen]
# Let swaylock exclusively own ext-session-lock-v1 and logind lock handling.
enabled = false

[shell.session]
[[shell.session.actions]]
# Keep this visible while Noctalia's native lock screen is disabled.
action = "command"
label = "Lock & Suspend"
glyph = "bedtime"
command = "swaylock -f && systemctl suspend"
variant = "primary"
shortcut = "1"

[[shell.session.actions]]
action = "reboot"
variant = "destructive"
countdown_seconds = 5
shortcut = "2"

[[shell.session.actions]]
action = "shutdown"
variant = "destructive"
countdown_seconds = 5
shortcut = "3"

[bar.default]
auto_hide = true
reserve_space = false
start = ["wallpaper", "workspaces"]
end = ["tray", "notifications", "battery", "session"]
scale = 1.25

[control_center]
width = 900

[system.monitor]
enabled = true  
# Keep GPU polling infrequent and avoid unnecessarily waking the discrete GPU.
gpu_poll_seconds = 5.0

# Keep a blurred wallpaper texture ready for Niri's overview backdrop.
# This stays resident in GPU memory so overview entry does not need to regenerate it.
[backdrop]
enabled = true
blur_intensity = 0.5
tint_intensity = 0.3

[wallpaper]
enabled = true
directory = "@xdgDataHome@/wallpapers"
