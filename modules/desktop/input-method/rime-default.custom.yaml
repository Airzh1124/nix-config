# Rime Patch settings
# encoding: utf-8

patch:
  __include: rime_ice_suggestion:/
  __patch:
    # Keep full Pinyin and Flypy under the same Rime input method; use the
    # schema menu (F4) to switch between them.
    schema_list:
      - schema: rime_ice
      - schema: double_pinyin_flypy

    # Open the schema menu with F4 only. The upstream Ctrl+` shortcut would
    # swallow the terminal toggle in Zed and VS Code. The slash path replaces
    # only the hotkey list and keeps the rest of the switcher settings.
    switcher/hotkeys:
      - F4

    # Spell out the complete mapping because patching switch_key replaces the
    # upstream mapping rather than merging individual keys.
    ascii_composer:
      good_old_caps_lock: true
      switch_key:
        Caps_Lock: noop
        Shift_L: commit_code
        Shift_R: noop
        Control_L: noop
        Control_R: noop

    # Commit the literal composition (for example, "nihao") instead of the
    # first candidate when pressing Enter.
    editor:
      bindings:
        Return: commit_raw_input
        KP_Enter: commit_raw_input
